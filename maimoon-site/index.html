    <!-- Google Analytics 4 — injected only when VITE_GA_MEASUREMENT_ID is set at build time; no-op otherwise -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function(){
        var id = '%VITE_GA_MEASUREMENT_ID%';
        if (id.charAt(0) !== 'G') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', id);
      })();
    </script>
  </head>

    <script>
      (function(){var t=localStorage.getItem('theme');if(t==='dark'||(t===null&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.dataset.theme='dark';}})();
    </script>
    <div id="root"></div>
